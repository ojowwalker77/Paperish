name: design diff

on:
  pull_request:
    paths: ['**/*.paperish', 'action.yml', '.github/workflows/design-diff.yml']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: design-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  design-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
